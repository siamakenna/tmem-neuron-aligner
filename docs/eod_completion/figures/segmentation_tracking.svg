<text x="454" y="2319" font-family="sans-serif" font-size="15" font-weight="bold" fill="#14283e">Puncta / diffuse</text>
<text x="454" y="2380" font-family="sans-serif" font-size="17" fill="#53677b">Unavailable in supplied evidence</text>
<text x="454" y="2412" font-family="sans-serif" font-size="13" fill="#53677b">No replacement image has been invented.</text>
